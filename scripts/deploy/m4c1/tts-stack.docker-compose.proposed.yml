
services:

  qwen3-tts:
    build:
      context: ./qwen
      network: host
      args:
        HTTP_PROXY: http://127.0.0.1:7890
        HTTPS_PROXY: http://127.0.0.1:7890

    image: xlbnas/qwen3-tts:1.7b
    container_name: qwen3-tts

    network_mode: host

    gpus: all

    restart: unless-stopped

    environment:
      HTTP_PROXY: http://127.0.0.1:7890
      HTTPS_PROXY: http://127.0.0.1:7890
      http_proxy: http://127.0.0.1:7890
      https_proxy: http://127.0.0.1:7890

      NO_PROXY: localhost,127.0.0.1

      HF_HOME: /models/hf
      HUGGINGFACE_HUB_CACHE: /models/hf/hub

      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

    volumes:
      - ./models/qwen:/models/hf

    shm_size: 8gb


  indextts2:

    image: neosun/indextts2:v2.2-performance-optimized

    container_name: indextts2

    # 不声明 command：正式 compose 同样未声明，运行中使用 image-default
    # CMD。semantic gate 将 command 列为 immutable（None == None 才允许
    # 迁移），禁止在此手工重建"等价 command"。

    networks:
      - zhiying-tts-net

    ports:
      - "127.0.0.1:8002:8002"
      - "7870:7870"

    gpus: all

    restart: unless-stopped

    environment:
      HTTP_PROXY: http://127.0.0.1:7890
      HTTPS_PROXY: http://127.0.0.1:7890
      http_proxy: http://127.0.0.1:7890
      https_proxy: http://127.0.0.1:7890

      NO_PROXY: localhost,127.0.0.1

      HF_ENDPOINT: https://huggingface.co

      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

      # M4-C1B0：uv runtime dependency resolution offline。镜像 build 期
      # 已完成 uv sync，启动时禁止 uv 重新 sync/build（否则会经 proxy
      # 去 PyPI 拉 hatchling——proxy 127.0.0.1:7890 在 bridge 下不可达，
      # 这是第一次 migration 失败的根因）。不宣称整个 container 无网络：
      # 8002/7870 正常服务。
      UV_NO_SYNC: "1"

      # 禁止 uv 自身任何网络访问（uv runtime dependency resolution is
      # offline——IndexTTS2 服务本身仍在普通 Docker bridge 网络）
      UV_OFFLINE: "1"

      # M4-C1B2-R5A：HuggingFace runtime artifact closure。HF_HUB_CACHE 指向
      # 镜像烘焙缓存 /app/checkpoints/hf_cache（image-baked artifact，
      # container recreate 后仍存在）；HF_HUB_OFFLINE=1 禁止任何 HF Hub
      # 网络访问——proxy 127.0.0.1:7890 在 bridge 下不可达，这是第二次
      # migration 失败（IndexTTS2.__init__ hf_hub_download ProxyError
      # crash-loop）的根因。已用 --network none + HF_HUB_OFFLINE=1
      # disposable probe 实证四个启动必需 artifact（amphion/MaskGCT、
      # facebook/w2v-bert-2.0、funasr/campplus、
      # nvidia/bigvgan_v2_22khz_80band_256x）全部从该缓存解析；不新增
      # volume、不使用 /root/.cache/huggingface（writable-layer 增量
      # recreate 即丢失）。
      HF_HUB_CACHE: /app/checkpoints/hf_cache
      HF_HUB_OFFLINE: "1"

    volumes:
      - ./outputs/index:/app/outputs

    shm_size: 8gb

    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:8002/health >/dev/null || exit 1
      interval: 15s
      timeout: 10s
      start_period: 600s
      retries: 10


  cosyvoice3:

    image: neosun/cosyvoice:v3.4.0

    container_name: cosyvoice3

    network_mode: host

    gpus: all

    restart: unless-stopped

    environment:
      HTTP_PROXY: http://127.0.0.1:7890
      HTTPS_PROXY: http://127.0.0.1:7890
      http_proxy: http://127.0.0.1:7890
      https_proxy: http://127.0.0.1:7890

      NO_PROXY: localhost,127.0.0.1

      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

    volumes:
      - ./data/cosyvoice:/data/voices

    shm_size: 8gb


networks:
  zhiying-tts-net:
    external: true
    name: zhiying-tts-net
