# 知影 M7 quality gate（TTS-B.R2）：m7 分支独立可审计 CI
#
# 边界：不调用真实 APIYi / DeepSeek / 其他 LLM / IndexTTS2 / production DB /
#       production SSH / production GPU / production secret。所有测试使用临时 DB、
#       Mock LLM、Mock TTS。authoritative 测试清单唯一来源：
#       scripts/run-m7-quality-gate.sh（与 agentvm / 镜像内共用）。
name: m7-quality-gate

on:
  push:
    branches:
      - m7
  pull_request:
  workflow_dispatch:

concurrency:
  group: m7-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: M7 Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NODE_ENV: test
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      # Node / pnpm 版本与仓库一致（package.json packageManager = pnpm@11.9.0；Dockerfile node:22-bookworm）
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node dependencies（frozen-lockfile）
        run: pnpm install --frozen-lockfile

      - name: Install real ffmpeg / ffprobe（TTS-A/TTS-B 音频回归依赖）
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Version info
        id: versions
        run: |
          echo "node=$(node --version)"
          echo "pnpm=$(pnpm --version)"
          echo "ffmpeg=$(ffmpeg -version | head -1)"
          echo "ffprobe=$(ffprobe -version | head -1)"
          echo "sha=$(git rev-parse HEAD)"

      - name: Run M7 quality gate（统一权威入口）
        id: gate
        run: |
          set -o pipefail
          bash scripts/run-m7-quality-gate.sh |
            tee /tmp/quality-gate-console.log
        # 失败必须使 workflow conclusion = failure：
        #   - 外层 shell 显式启用 pipefail，防止 tee 吞掉子脚本退出码（TTS-B.R3）；
        #   - 不使用 continue-on-error / command || true / 只看日志中的 QUALITY_GATE_RESULT。

      - name: Upload quality gate logs（成功/失败均上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-quality-gate-${{ github.sha }}
          path: |
            /tmp/quality-gate-console.log
            /tmp/m7-quality-gate.log
            /tmp/versions.txt
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          GATE_RESULT=$(grep -E '^QUALITY_GATE_RESULT=' /tmp/quality-gate-console.log | tail -1 | cut -d= -f2 | xargs || echo unknown)
          GATE_SHA=$(grep -E '^QUALITY_GATE_SHA=' /tmp/quality-gate-console.log | tail -1 | cut -d= -f2 | xargs || echo unknown)
          GATE_SUITES=$(grep -E '^QUALITY_GATE_TOTAL_SUITES=' /tmp/quality-gate-console.log | tail -1 | cut -d= -f2 | xargs || echo unknown)
          {
            echo "## M7 Quality Gate — ${{ github.sha }}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| commit SHA | \`${{ github.sha }}\` |"
            echo "| Node | $(node --version) |"
            echo "| pnpm | $(pnpm --version) |"
            echo "| ffmpeg | $(ffmpeg -version 2>/dev/null | head -1) |"
            echo "| ffprobe | $(ffprobe -version 2>/dev/null | head -1) |"
            echo "| typecheck/build | 见 gate 步骤日志 |"
            echo "| gate result | ${GATE_RESULT} |"
            echo "| gate SHA | ${GATE_SHA} |"
            echo "| suites | ${GATE_SUITES}（由 run-m7-quality-gate.sh 权威输出，非硬编码） |"
            echo "| conclusion | ${{ job.status }} |"
            echo ""
            echo "完整测试日志见 artifact \`m7-quality-gate-${{ github.sha }}\`。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── TTS-C Contract Gate（R11）：TTS-C 架构 contract 的双引擎实证 ──────────
  # 与上方 27-suite runtime gate 分别报告，不混称。
  # 边界：无 Node/无真实 provider/无 production DB；纯 Python + 系统 sqlite3 CLI。
  # 在 final HEAD 重新生成双引擎结果（不依赖 checked-in result 伪装执行）。
  tts-c-contract-gate:
    name: TTS-C Contract Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: sqlite3 CLI version fail-closed pin（exact 3.45.1；不匹配即 failure）
        run: |
          ACTUAL="$(sqlite3 --version | awk '{print $1}')"
          echo "sqlite3 CLI version: ${ACTUAL}"
          test "$ACTUAL" = "3.45.1"
          python3 -c "import sqlite3; print('python sqlite3 version:', sqlite3.sqlite_version)"

      - name: Run TTS-C contract runner（双引擎）
        id: contract
        run: |
          set -o pipefail
          python3 docs/evidence/tts-c-r12/contract_runner.py \
            --design docs/TTS_C_INCREMENTAL_NARRATION_DESIGN.md \
            --sqlite-bin sqlite3 \
            --engine all \
            --results-dir /tmp/ttsc-r11-ci | tee /tmp/ttsc-r11-console.log

      - name: 双引擎一致性校验（test ID / TOTAL/PASS/FAIL/SKIP / design SHA / SQL SHA）
        run: |
          python3 docs/evidence/tts-c-r12/verify_engines.py \
            /tmp/ttsc-r11-ci/results-python-sqlite.txt \
            /tmp/ttsc-r11-ci/results-sqlite-3.45.1.txt

      - name: SHA 与 current checkout 一致性（EA-05）
        run: |
          python3 - <<'EOF'
          import sys, hashlib
          sys.path.insert(0, "docs/evidence/tts-c-r12")
          from extract_contract import extract_section2_sql
          cur = extract_section2_sql("docs/TTS_C_INCREMENTAL_NARRATION_DESIGN.md")["sha256"]
          rec = None
          for line in open("/tmp/ttsc-r11-ci/results-python-sqlite.txt", encoding="utf-8"):
              if line.startswith("extracted §2 sql sha256"):
                  rec = line.split(":", 1)[1].strip()
          if rec != cur:
              print("SQL SHA MISMATCH: results=%s current=%s" % (rec, cur))
              sys.exit(1)
          print("SQL SHA consistent: %s" % cur)
          EOF

      - name: Upload contract gate results（成功/失败均上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-c-contract-gate-${{ github.sha }}
          path: |
            /tmp/ttsc-r11-ci/results-*.txt
            /tmp/ttsc-r11-console.log
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          PY_RESULTS=/tmp/ttsc-r11-ci/results-python-sqlite.txt
          CLI_RESULTS=/tmp/ttsc-r11-ci/results-sqlite-3.45.1.txt
          TOTAL=$(grep -E '^TOTAL=' "$PY_RESULTS" | tail -1)
          PY_VER=$(grep -E '^python sqlite3 version' "$PY_RESULTS" | tail -1 | cut -d: -f2 | xargs)
          CLI_VER=$(grep -E '^engine sqlite version' "$CLI_RESULTS" | tail -1 | cut -d: -f2 | xargs)
          DES_SHA=$(grep -E '^design doc sha256' "$PY_RESULTS" | tail -1 | cut -d: -f2 | xargs)
          SQL_SHA=$(grep -E '^extracted §2 sql sha256' "$PY_RESULTS" | tail -1 | cut -d: -f2 | xargs)
          {
            echo "## TTS-C Contract Gate — ${{ github.sha }}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| commit SHA | \`${{ github.sha }}\` |"
            echo "| contract ${TOTAL} |"
            echo "| Python SQLite version | ${PY_VER} |"
            echo "| CLI SQLite version | ${CLI_VER} |"
            echo "| design SHA | \`${DES_SHA}\` |"
            echo "| SQL SHA | \`${SQL_SHA}\` |"
            echo "| conclusion | ${{ job.status }} |"
            echo ""
            echo "TTS-C contract tests × engines（与 27-suite runtime gate 分别报告）。"
          } >> "$GITHUB_STEP_SUMMARY"
